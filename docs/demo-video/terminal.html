<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Converge demo: under the hood</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        background: #0f1218;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0f1218;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(150px);
      }
      #b1 {
        width: 900px;
        height: 900px;
        background: #3b3278;
        opacity: 0.5;
      }
      #b2 {
        width: 760px;
        height: 760px;
        background: #14503f;
        opacity: 0.36;
      }
      #b3 {
        width: 620px;
        height: 620px;
        background: #5a2631;
        opacity: 0.26;
      }
      #win {
        position: absolute;
        left: 150px;
        top: 70px;
        width: 1620px;
        height: 940px;
        border-radius: 22px;
        background: #0a0c11;
        border: 1.5px solid #2a3040;
        box-shadow:
          0 0 100px rgba(117, 102, 220, 0.32),
          0 30px 90px rgba(0, 0, 0, 0.55);
        overflow: hidden;
      }
      #bar {
        height: 52px;
        background: #14171f;
        border-bottom: 1.5px solid #232837;
        display: flex;
        align-items: center;
        gap: 10px;
        padding-left: 22px;
      }
      #bar i {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        display: block;
      }
      #term {
        position: absolute;
        left: 0;
        right: 0;
        top: 52px;
        bottom: 0;
        padding: 26px 34px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        font:
          400 21px/1.42 "JetBrains Mono",
          "DejaVu Sans Mono",
          ui-monospace,
          monospace;
        color: #c9cfdd;
      }
      #txt {
        white-space: pre-wrap;
        word-break: break-all;
      }
      .p {
        color: #5fd7ae;
        font-weight: 600;
      }
      .c {
        color: #eef0f6;
        font-weight: 600;
      }
      .ok {
        color: #5fd7ae;
      }
      .wn {
        color: #f3c874;
      }
      .dim {
        color: #8d95a8;
      }
      .cur {
        background: #b6aaf6;
        color: #0a0c11;
      }
      #logo {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        background: radial-gradient(
          circle at 50% 46%,
          rgba(117, 102, 220, 0.34),
          rgba(15, 18, 24, 0.97) 62%
        );
      }
      #logo img {
        width: 820px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="blob" id="b1"></div>
      <div class="blob" id="b2"></div>
      <div class="blob" id="b3"></div>
      <div id="win">
        <div id="bar">
          <i style="background: #f48b98"></i><i style="background: #f3c874"></i
          ><i style="background: #5fd7ae"></i>
        </div>
        <div id="term"><div id="txt"></div></div>
      </div>
      <div id="logo"><img src="assets/logo-dark.svg" alt="" /></div>
    </div>
    <script>
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const $ = (id) => document.getElementById(id);
      const CPS = 60,
        HOLD_STEP = 0.5,
        HOLD_SCENE = 1.3,
        LOGO = 3.2;
      let TL = null;
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const color = (l) =>
        /^✓/.test(l)
          ? `<span class="ok">${esc(l)}</span>`
          : /^!/.test(l)
            ? `<span class="wn">${esc(l)}</span>`
            : esc(l);
      async function init() {
        const d = await (await fetch("terminal.json")).json();
        let t = 0;
        const scenes = d.scenes.map((s) => {
          const sc = { start: t, steps: [] };
          let u = 0;
          for (const st of s.steps) {
            const type = st.cmd.length / CPS + 0.4,
              per = st.speed ?? 0.12;
            const outDur = st.out.length * per;
            sc.steps.push({ ...st, a: u, type, per, end: u + type + outDur + HOLD_STEP });
            u += type + outDur + HOLD_STEP;
          }
          sc.dur = u + HOLD_SCENE - HOLD_STEP;
          t += sc.dur;
          return sc;
        });
        TL = { scenes, total: t + LOGO, logoAt: t };
        window.__total = TL.total;
        await document.fonts.ready;
        window.__ready = true;
      }
      function draw(t) {
        $("b1").style.transform =
          `translate(${300 + Math.sin(t / 9) * 120}px, ${-180 + Math.cos(t / 11) * 80}px)`;
        $("b2").style.transform =
          `translate(${1250 + Math.cos(t / 8) * 110}px, ${420 + Math.sin(t / 10) * 90}px)`;
        $("b3").style.transform =
          `translate(${-120 + Math.sin(t / 12) * 90}px, ${620 + Math.cos(t / 9) * 70}px)`;
        const sc = TL.scenes.find((s) => t >= s.start && t < s.start + s.dur) ?? TL.scenes.at(-1);
        const s = t - sc.start;
        let html = "";
        const fadeIn = clamp((t - 0.0) / 0.5),
          winA = Math.min(fadeIn, 1 - clamp((t - TL.logoAt + 0.4) / 0.8));
        $("win").style.opacity = winA;
        $("logo").style.opacity = clamp((t - TL.logoAt) / 0.9);
        for (const st of sc.steps) {
          if (s < st.a) break;
          const lt = s - st.a,
            n = clamp(Math.floor(lt * 60), 0, st.cmd.length);
          const typing = lt < st.type - 0.05;
          html += `<span class="p">converge $ </span><span class="c">${esc(st.cmd.slice(0, typing ? n : st.cmd.length))}</span>`;
          if (typing && Math.floor(t * 2.2) % 2 === 0) html += '<span class="cur"> </span>';
          html += "\n";
          if (!typing) {
            const k = Math.min(st.out.length, Math.floor((lt - st.type) / st.per) + 1);
            for (let i = 0; i < k; i++) html += color(st.out[i]) + "\n";
          }
        }
        const last = sc.steps.at(-1);
        if (
          s >= last.a + last.type &&
          Math.floor(t * 2.2) % 2 === 0 &&
          s > last.a + last.type + last.out.length * last.per
        )
          html += '<span class="p">converge $ </span><span class="cur"> </span>';
        $("txt").innerHTML = html;
        const term = $("term"); // top-anchored like a fresh terminal; once the output overflows it scrolls and stays on the newest line
        term.style.justifyContent =
          $("txt").offsetHeight > term.clientHeight - 52 ? "flex-end" : "flex-start";
        return true;
      }
      window.render = async (t) => (TL ? draw(t) : (await init(), draw(t)));
      init();
    </script>
  </body>
</html>
