# Alertmanager for the mainnet beta, rendered by render.sh (which fills in the Telegram chat id).
# Two independent providers, so one outage does not silence the page:
#   discord   every alert                   (webhook URL in the file secret `alert_webhook`)
#   telegram  severity=page only            (bot token in the file secret `telegram_token`)
#   heartbeat the always-firing Watchdog   (URL in the file secret `heartbeat_url`; the service alerts on silence)
# `page` alerts go to both and repeat every 15 minutes until resolved or silenced.
route:
  receiver: discord
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    # the dead-man switch: Prometheus fires this alert all the time; an EXTERNAL heartbeat service
    # (healthchecks.io or similar) pages when it stops arriving, which catches the host, the Docker
    # daemon, Prometheus and Alertmanager dying together
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat
      repeat_interval: 5m
    - matchers: [severity="page"]
      receiver: page
      repeat_interval: 15m
receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/alert_webhook
        send_resolved: true
  - name: page
    discord_configs:
      - webhook_url_file: /run/secrets/alert_webhook
        send_resolved: true
        title: "PAGE: {{ .GroupLabels.alertname }}"
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_token
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        parse_mode: ""
  - name: heartbeat
    webhook_configs:
      - url_file: /run/secrets/heartbeat_url
        send_resolved: false
        max_alerts: 1
