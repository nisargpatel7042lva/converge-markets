name: ci
on:
  push:
  pull_request:
jobs:
  check-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-node first so pnpm 11 (needs Node >= 22.13) never runs on the runner default Node
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4 # pinned: forge fmt/lint output must match local
      - run: pipx install slither-analyzer==0.11.6
      - run: make install
      - run: make check-all
